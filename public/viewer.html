<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer - WebRTC</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Header Sederhana -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">📡</div>
        <span>WebRTC Broadcast</span>
      </a>
      <nav class="header-nav">
        <a href="index.html" class="nav-link">📹 Broadcaster</a>
        <a href="viewer.html" class="nav-link active">📺 Viewer</a>
        <a href="meeting.html" target="_blank" class="nav-link">👥 Meeting ↗</a>
      </nav>
    </div>
  </header>

  <!-- Konten Utama (Simple & Bersih) -->
  <main class="main-wrapper" style="max-width: 680px; padding: 28px 16px;">
    <!-- Judul Halaman -->
    <div
      style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 style="font-size: 1.55rem; font-weight: 800; display: flex; align-items: center; gap: 8px;">
          📺 Viewer
        </h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">
          Menerima dan menonton siaran video real-time dari Broadcaster.
        </p>
      </div>
      <div>
        <span class="status-pill ready" id="statusBadge">
          <span class="pulsing-dot"></span>
          <span id="statusText">Menunggu Token</span>
        </span>
      </div>
    </div>

    <!-- Form Input Token -->
    <div class="glass-panel" style="padding: 20px; margin-bottom: 20px;">
      <label for="tokenInput"
        style="display: block; font-size: 0.85rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px;">
        🔑 MASUKKAN TOKEN SIARAN:
      </label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="tokenInput" placeholder="Contoh: a8f9cd21" autocomplete="off" spellcheck="false"
          style="flex: 1; padding: 12px 16px; font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; background: #0b0f19; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: var(--radius-sm); color: #fff;">
        <button class="btn-primary" id="joinBtn"
          style="padding: 12px 22px; font-size: 0.95rem; white-space: nowrap; background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);">
          <span>🚀</span> Tonton Siaran
        </button>
      </div>
    </div>

    <!-- Kotak Video Penerima (Remote) -->
    <div class="glass-panel" style="padding: 16px; margin-bottom: 20px;">
      <div class="video-stage" id="videoStage"
        style="aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; position: relative;">
        <!-- Tag Status Atas Video -->
        <div class="video-overlay-top">
          <span class="overlay-tag" id="liveTag" style="display: none; background: rgba(16, 185, 129, 0.9);">
            <span class="pulsing-dot" style="background: #fff; box-shadow: 0 0 8px #fff;"></span>
            STREAMING LIVE (WEBRTC)
          </span>
          <span class="overlay-tag">
            🌐 WebRTC Receiver
          </span>
        </div>

        <!-- Video Element Remote -->
        <video id="remoteVideo" autoplay playsinline
          style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
      </div>

      <!-- Kontrol Video -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
        <button class="btn-icon" id="unmuteBtn" style="padding: 8px 14px; font-size: 0.85rem;">
          <span id="unmuteIcon">🔊</span> <span id="unmuteText">Unmute Audio</span>
        </button>
        <button class="btn-icon" id="fsBtn" style="padding: 8px 14px; font-size: 0.85rem;">
          <span>⛶</span> Layar Penuh
        </button>
      </div>
    </div>
  </main>

  <!-- Notifikasi Toast -->
  <div class="toast-alert" id="toastAlert">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMsg">Pesan notifikasi</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="app-viewer.js"></script>
</body>

</html>
